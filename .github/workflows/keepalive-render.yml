name: Keep-Alive Render API (hasta 6 dic 2026)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar vigencia y mantener activa la API
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "20261206" ]; then
            echo "Periodo finalizado (posterior al 2026-12-06); ping omitido."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 65 https://uk-vivienda-api.onrender.com/healthz
